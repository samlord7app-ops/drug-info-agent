services:
  - type: web
    name: drug-info-agent
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:${PORT:-10000} --workers 1 --threads 4 --timeout 120 --max-requests 500 --max-requests-jitter 50 drug_app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
